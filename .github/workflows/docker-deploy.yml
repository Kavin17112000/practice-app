name: Docker Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend
        run: |
          docker build -t kavin17112000/practice-app-frontend:latest ./frontend

      - name: Build Backend
        run: |
          docker build -t kavin17112000/practice-app-backend:latest ./backend

      - name: Push Frontend
        run: |
          docker push kavin17112000/practice-app-frontend:latest

      - name: Push Backend
        run: |
          docker push kavin17112000/practice-app-backend:latest